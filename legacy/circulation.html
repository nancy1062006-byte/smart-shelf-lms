<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue &amp; return — Smart-Shelf Library</title>
<meta name="description" content="Track your Smart-Shelf loans, see due dates and overdue books, and return borrowed copies.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar-ss">
  <div class="container d-flex flex-wrap align-items-center gap-3">
    <a class="brand" href="index.html">Smart-Shelf</a>
    <ul class="nav me-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
      <li class="nav-item"><a class="nav-link active" href="circulation.html">Issue / Return</a></li>
      <li class="nav-item d-none" id="nav-admin"><a class="nav-link" href="admin.html">Admin</a></li>
    </ul>
    <div id="nav-auth" class="d-flex align-items-center"></div>
  </div>
</nav>

<main class="container py-5">
  <h1 class="h2">My loans</h1>
  <p class="text-muted">Books are due 14 days after they are issued.</p>

  <div class="row g-3 my-3">
    <div class="col-4"><div class="card-ss"><div class="card-body text-center">
      <div class="stat-value" id="stat-active">—</div><div class="stat-label">Active</div></div></div></div>
    <div class="col-4"><div class="card-ss"><div class="card-body text-center">
      <div class="stat-value" id="stat-overdue">—</div><div class="stat-label">Overdue</div></div></div></div>
    <div class="col-4"><div class="card-ss"><div class="card-body text-center">
      <div class="stat-value" id="stat-history">—</div><div class="stat-label">Total borrowed</div></div></div></div>
  </div>

  <div class="table-responsive table-ss mt-4">
    <table class="table align-middle mb-0">
      <thead><tr>
        <th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th><th></th>
      </tr></thead>
      <tbody id="loans-body"></tbody>
    </table>
  </div>
</main>

<footer class="site-footer">
  <div class="container">Smart-Shelf — Library Management System · College project demo</div>
</footer>

<script src="assets/app.js"></script>
<script>initCirculation();</script>
</body>
</html>
