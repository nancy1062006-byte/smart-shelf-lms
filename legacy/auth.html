<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in or register — Smart-Shelf Library</title>
<meta name="description" content="Create a Smart-Shelf student or librarian account to borrow books and manage the college library.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar-ss">
  <div class="container d-flex flex-wrap align-items-center gap-3">
    <a class="brand" href="index.html">Smart-Shelf</a>
    <ul class="nav me-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
      <li class="nav-item"><a class="nav-link" href="circulation.html">Issue / Return</a></li>
      <li class="nav-item d-none" id="nav-admin"><a class="nav-link" href="admin.html">Admin</a></li>
    </ul>
    <div id="nav-auth" class="d-flex align-items-center"></div>
  </div>
</nav>

<main class="container py-5" style="max-width: 30rem">
  <div class="card-ss">
    <div class="card-body">
      <h1 class="h3 mb-1">Library account</h1>
      <p class="text-muted">Students borrow books. Librarians manage the shelf.</p>

      <ul class="nav nav-tabs mb-4" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-login" type="button">Sign in</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-register" type="button">Register</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-login">
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label" for="l-email">Email</label>
              <input class="form-control" id="l-email" name="email" type="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="l-pass">Password</label>
              <input class="form-control" id="l-pass" name="password" type="password" required>
            </div>
            <button class="btn btn-ss w-100" type="submit">Sign in</button>
          </form>
          <p class="text-muted small mt-3 mb-0">
            Demo accounts: <code>admin@smartshelf.edu</code> / <code>student@smartshelf.edu</code>
            — password <code>password123</code>
          </p>
        </div>

        <div class="tab-pane fade" id="tab-register">
          <form id="register-form">
            <div class="mb-3">
              <label class="form-label" for="r-name">Full name</label>
              <input class="form-control" id="r-name" name="full_name" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="r-email">Email</label>
              <input class="form-control" id="r-email" name="email" type="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="r-pass">Password</label>
              <input class="form-control" id="r-pass" name="password" type="password" minlength="6" required>
            </div>
            <div class="mb-3">
              <label class="form-label d-block">I am a</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="role" id="role-student" value="student" checked>
                <label class="form-check-label" for="role-student">Student</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="role" id="role-lib" value="librarian">
                <label class="form-check-label" for="role-lib">Librarian</label>
              </div>
            </div>
            <button class="btn btn-ss w-100" type="submit">Create account</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/app.js"></script>
<script>initAuth();</script>
</body>
</html>
